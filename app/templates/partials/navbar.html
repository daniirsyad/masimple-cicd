<div
  class="navbar sticky top-0 z-20 bg-base-100 border-b border-base-200 min-h-12 py-1"
>
  <div class="flex-none">
    <button
      type="button"
      id="sidebar-toggle"
      aria-label="Toggle sidebar"
      aria-expanded="true"
      class="btn btn-square btn-ghost btn-sm"
    >
      <span class="hamburger-box">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </span>
    </button>
  </div>

  <div class="flex-1">
    <a
      href="{{ url_for('main.index') }}"
      id="navbar-title"
      class="ml-2 text-lg font-semibold"
      data-hide-when-sidebar-open="{{ 'true' if system_config.hide_navbar_title_when_sidebar_open else 'false' }}"
      >MASIMPLE CICD</a
    >
  </div>

  <div class="flex-none gap-2">
    {% if navbar_menu %}
    <ul class="menu menu-horizontal menu-sm hidden px-1 md:flex">
      {% for item in navbar_menu %}
      <li><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    {% endif %}
    <button
      type="button"
      id="theme-toggle"
      aria-label="Toggle dark mode"
      class="btn btn-square btn-ghost btn-sm"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="theme-icon-light h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="theme-icon-dark hidden h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        />
      </svg>
    </button>
    {% if current_user.is_authenticated %}
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-sm">
        {{ current_user.full_name or current_user.username }}
      </div>
      <ul
        tabindex="0"
        class="menu menu-sm dropdown-content z-1 mt-3 w-40 rounded-box bg-base-100 p-2 shadow"
      >
        <li><a href="{{ url_for('auth.logout') }}">Logout</a></li>
      </ul>
    </div>
    {% endif %}
  </div>
</div>
