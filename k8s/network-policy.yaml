apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masimple-cicd-web-whitelist
  namespace: masimple-cicd
spec:
  podSelector:
    matchLabels:
      app: masimple-cicd
  policyTypes:
    - Ingress
  ingress:
    - from:
        # One ipBlock entry per allowed source. /32 for a single IP.
        # Example (delete once you've added real entries):
        #   - ipBlock:
        #       cidr: 203.0.113.10/32   # office IP
        #   - ipBlock:
        #       cidr: 198.51.100.0/24   # VPN range
        - ipBlock:
            cidr: "<YOUR_WHITELISTED_IP_OR_CIDR_1>"
        - ipBlock:
            cidr: "<YOUR_WHITELISTED_IP_OR_CIDR_2>"
      ports:
        - protocol: TCP
          port: 8000
