services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Grants the container root-equivalent access to the host Docker daemon,
      # required so the image builder module can run `docker build`/`docker push`.
      # Acceptable here since this is a small, permission-gated internal admin tool.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent clones of registered repos (see "Repo registration &
      # persistent clones") live at REPO_CLONE_ROOT, which defaults to
      # ./data/repos inside the app itself (see config.py) — /app/data/repos
      # in the container. Without this volume, clones live in the
      # container's own writable layer and are lost on recreation, silently
      # degrading Builder branch/Dockerfile pickers (and worse, hiding an
      # already-saved Builder's own branch from its edit form) until the
      # next manual Re-sync or build re-clones them.
      - repo_clones:/app/data/repos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masimple_cicd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masimple_cicd}
      POSTGRES_DB: ${POSTGRES_DB:-masimple_cicd}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masimple_cicd}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  repo_clones:
